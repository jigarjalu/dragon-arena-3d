<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="magicGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Dragon Skin Gradients -->
    <linearGradient id="dragonSkin" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="dragonSnout" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Horn Gradients -->
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="65%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="hornBackGrad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Eye Gradients -->
    <radialGradient id="eyeIris" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#magicGlow)"/>

  <!-- Golden Border Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="12" opacity="0.95"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.4"/>

  <!-- Magical Starlight Sparkles -->
  <circle cx="95" cy="115" r="3.5" fill="#fef08a" opacity="0.8"/>
  <polygon points="95,102 98,112 108,115 98,118 95,128 92,118 82,115 92,112" fill="#fef08a" opacity="0.85"/>
  <polygon points="415,95 418,103 426,105 418,107 415,115 412,107 404,105 412,103" fill="#6ee7b7" opacity="0.75"/>
  <polygon points="435,395 437,402 444,404 437,406 435,413 433,406 426,404 433,402" fill="#fef08a" opacity="0.7"/>

  <!-- Back Dorsal Spines -->
  <g filter="url(#shadowFilter)">
    <!-- Back Neck & Spines -->
    <polygon points="175,210 145,155 195,190" fill="#f59e0b"/>
    <polygon points="145,260 110,215 168,245" fill="#d97706"/>
    <polygon points="130,320 90,285 150,310" fill="#b45309"/>
    <polygon points="120,380 80,355 140,375" fill="#92400e"/>

    <!-- Far/Back Horn (Left) -->
    <path d="M 215,175 C 195,120 155,70 120,52 C 145,95 180,160 198,195 Z" fill="url(#hornBackGrad)"/>
    <path d="M 175,95 C 160,80 140,65 120,52 C 130,70 148,92 165,112 Z" fill="#fde047" opacity="0.6"/>

    <!-- Dragon Neck & Back Body -->
    <path d="M 185,210 C 135,270 125,360 155,440 C 220,460 300,460 365,430 C 340,380 320,330 305,275 Z" fill="#047857"/>
    <path d="M 195,225 C 150,280 142,360 170,435 C 225,455 295,450 350,425 C 330,375 312,325 300,270 Z" fill="url(#dragonSkin)"/>

    <!-- Main Cranium / Dragon Head -->
    <path d="M 220,180 C 240,140 310,135 365,170 C 415,200 455,250 465,300 C 470,325 450,355 410,365 C 360,375 310,360 275,340 C 240,320 205,280 195,230 C 190,205 205,190 220,180 Z" fill="url(#dragonSkin)"/>

    <!-- Sculpted Muzzle / Snout -->
    <path d="M 330,225 C 390,230 450,265 465,305 C 470,325 450,350 410,355 C 365,360 320,335 295,300 C 300,265 315,235 330,225 Z" fill="url(#dragonSnout)"/>

    <!-- Underbelly / Golden Jaw Plate -->
    <path d="M 285,325 C 330,355 385,365 420,350 C 405,375 365,395 320,395 C 275,395 240,370 225,340 C 245,335 265,330 285,325 Z" fill="url(#jawGrad)"/>

    <!-- Ivory Fang -->
    <polygon points="388,348 402,348 395,372" fill="#fffbeb"/>
    <polygon points="390,348 396,348 393,368" fill="#fef08a"/>

    <!-- Nostril with subtle ember glow -->
    <ellipse cx="440" cy="295" rx="7" ry="12" transform="rotate(-20 440 295)" fill="#064e3b"/>
    <ellipse cx="441" cy="296" rx="3.5" ry="7" transform="rotate(-20 441 296)" fill="#f97316" opacity="0.85"/>

    <!-- Rosy Cheek Warmth -->
    <circle cx="330" cy="315" r="28" fill="#f43f5e" opacity="0.25" filter="url(#softGlow)"/>

    <!-- Front Majestic Swept Crown Horn (Right) -->
    <path d="M 275,160 C 285,100 270,35 220,15 C 245,65 265,130 255,185 Z" fill="url(#hornGrad)"/>
    <!-- Horn Ridge Highlights -->
    <path d="M 258,40 C 270,75 272,120 265,165" stroke="#fef08a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 242,28 C 250,50 254,80 252,110" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Secondary Cheek Horn / Temporal Spine -->
    <path d="M 235,260 C 190,265 155,245 130,230 C 160,260 200,285 240,285 Z" fill="url(#hornGrad)"/>

    <!-- Brow Ridge -->
    <path d="M 315,195 C 345,190 380,205 400,225 C 375,220 345,215 315,220 Z" fill="#047857"/>
    <path d="M 320,198 C 350,195 382,210 398,228" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Big Expressive Dragon Eye Socket -->
    <ellipse cx="355" cy="235" rx="36" ry="42" transform="rotate(5 355 235)" fill="#064e3b"/>
    <ellipse cx="355" cy="235" rx="33" ry="39" transform="rotate(5 355 235)" fill="url(#eyeIris)"/>

    <!-- Stylized Vertical Slit Pupil -->
    <path d="M 355,202 C 368,222 368,248 355,268 C 344,248 344,222 355,202 Z" fill="#18181b"/>

    <!-- Eye Highlights / Specular Glints -->
    <circle cx="344" cy="220" r="11" fill="#ffffff" opacity="0.95"/>
    <circle cx="366" cy="246" r="5" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="355" cy="235" rx="28" ry="34" fill="none" stroke="#fde047" stroke-width="2" opacity="0.6"/>

    <!-- Forehead Scale Pattern Accents -->
    <polygon points="305,175 315,165 325,175 315,185" fill="#a7f3d0" opacity="0.6"/>
    <polygon points="328,170 338,160 348,170 338,180" fill="#a7f3d0" opacity="0.5"/>
    <polygon points="318,190 326,182 334,190 326,198" fill="#a7f3d0" opacity="0.55"/>

    <!-- Gentle Head Highlight / 3D Specular Arc -->
    <path d="M 270,180 C 310,165 370,175 410,215" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>
  </g>
</svg>
